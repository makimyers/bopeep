name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install jq if needed
        run: |
          if ! command -v jq >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install jq
            else
              sudo apt-get update
              sudo apt-get install -y jq
            fi
          fi
      - name: Check Bash syntax
        run: bash -n bopeep install.sh test.sh
      - name: Run regression checks
        run: bash test.sh
